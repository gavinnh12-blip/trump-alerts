name: trump-stock-monitor

# Scheduled sweep for Trump stock mentions. Commits new alert files back to the repo.
#
# Setup:
#   - (Recommended) add repo secret ANTHROPIC_API_KEY for high-quality LLM analysis.
#     Without it, the monitor still runs in heuristic candidate mode (free, no key).
#   - Adjust the cron schedule below to taste.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      lookback_days:
        description: "Days back to scan (manual runs only)"
        required: false
        default: "2"

# Allow the job to commit new alerts back to the branch.
permissions:
  contents: write

# Opt the bundled actions (checkout, setup-python) onto Node.js 24 now, so the
# "Node.js 20 actions are deprecated" runner warning doesn't appear.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: trump-stock-monitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          # Notifications — set whichever you use as repo secrets; unset = skipped.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Scheduled runs use the config default; manual runs honor the input box.
          if [ -n "$LOOKBACK_DAYS" ]; then
            python trump_monitor.py --lookback-days "$LOOKBACK_DAYS"
          else
            python trump_monitor.py
          fi

      - name: Commit new alerts
        run: |
          git config user.name "trump-alerts-bot"
          git config user.email "actions@github.com"
          git add alerts || true
          git add .monitor_seen.json || true   # may not exist on a no-op first run
          if git diff --cached --quiet; then
            echo "No new alerts."
          else
            git commit -m "chore(monitor): automated sweep $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
